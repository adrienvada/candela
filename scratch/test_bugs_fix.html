<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Bug Fixes Navigation & Mouse Click</title>
</head>
<body style="margin: 0; background: #000;">
    <iframe id="gameFrame" src="../index.html" style="width: 100vw; height: 100vh; border: none;"></iframe>

    <script>
        const iframe = document.getElementById('gameFrame');
        iframe.onload = () => {
            const win = iframe.contentWindow;

            // Connect simulated gamepad for P1
            const fakeGp1 = {
                id: 'DualSense (SIMULATED P1)',
                index: 0,
                connected: true,
                timestamp: performance.now(),
                mapping: 'standard',
                axes: [0, -1.0, 0, 0], // Move stick UP!
                buttons: Array(17).fill(0).map((_, i) => ({ pressed: false, value: 0.0 }))
            };

            win.navigator.getGamepads = () => [fakeGp1, null];
            win.dispatchEvent(new CustomEvent('gamepadconnected', { gamepad: fakeGp1 }));

            // Test 1: Stick Up moves focus UP without changing weapon!
            setTimeout(() => {
                fakeGp1.axes = [0, 0, 0, 0];
                console.log("🎮 Stick Up test complete!");
            }, 400);
        };
    </script>
</body>
</html>
